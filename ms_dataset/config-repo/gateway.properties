spring.application.name=gateway
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Spring Cloud 2025 (spring-cloud-starter-gateway-server-webflux) reads its settings under
# spring.cloud.gateway.server.webflux. The former spring.cloud.gateway.* keys are silently ignored:
# with them, no route at all was loaded.

# Enable automatic service discovery routing
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Custom routes for dataset-manager: the prefix is removed, the rest of the path is kept as is.
# (The former rewrite dropped "projects": /DATASET-MANAGER/api/projects/1 reached /api/1, a 404,
# and the list /DATASET-MANAGER/api/projects did not match the pattern at all.)
spring.cloud.gateway.server.webflux.routes[0].id=dataset-manager-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://dataset-manager
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/DATASET-MANAGER/api/projects/**,/DATASET-MANAGER/api/entities/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/DATASET-MANAGER/(?<segment>.*), /$\{segment}

# Custom routes for generator
spring.cloud.gateway.server.webflux.routes[1].id=generator-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://generator
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/GENERATOR-SERVICE/api/generator/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/GENERATOR-SERVICE/(?<segment>.*), /$\{segment}

# Find newly registered services within seconds instead of ~30 s (registry fetch and load-balancer cache):
# right after start-up, calls otherwise failed while the target was already running.
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
