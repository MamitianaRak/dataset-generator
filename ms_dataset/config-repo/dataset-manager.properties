
spring.application.name=dataset-manager
server.port=8081
server.servlet.context-path=/api
spring.h2.console.enabled=true

# H2 file database. A new file name: an H2 file created by the former ddl-auto=update schema has no Flyway
# history, and Flyway refuses to migrate over it.
spring.datasource.url=jdbc:h2:file:${user.dir}/data/dataset-manager
spring.datasource.username=sa
spring.datasource.password=

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# spring.config.import can be set locally on the service if needed
# spring.config.import=optional:configserver:http://localhost:8888
