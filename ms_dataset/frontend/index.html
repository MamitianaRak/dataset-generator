<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generateur de Datasets</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #f0f2f5;
        color: #1a202c;
        min-height: 100vh;
      }

      /* ---- HEADER ---- */
      .app-header {
        background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        color: white;
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      .header-logo {
        width: 36px; height: 36px;
        background: #4299e1;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.2rem; font-weight: bold; flex-shrink: 0;
      }
      .header-info h1 { font-size: 1.15rem; font-weight: 600; }
      .header-info p { font-size: 0.78rem; color: #a0aec0; margin-top: 2px; }
      .header-info code {
        background: rgba(255,255,255,0.1);
        padding: 1px 5px; border-radius: 3px; font-size: 0.75rem;
      }

      /* ---- LAYOUT ---- */
      .layout { display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; }

      /* ---- SIDEBAR ---- */
      .sidebar {
        width: 270px; flex-shrink: 0;
        background: white;
        border-radius: 10px;
        padding: 1rem;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }
      .sidebar h2 {
        font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; color: #718096; margin-bottom: 0.75rem;
      }
      .inline-form { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
      .inline-form input {
        flex: 1; min-width: 0;
        border: 1px solid #e2e8f0; border-radius: 6px;
        padding: 0.4rem 0.6rem; font-size: 0.88rem;
      }
      .inline-form input:focus { outline: none; border-color: #4299e1; }

      .project-list { list-style: none; max-height: 55vh; overflow-y: auto; margin-bottom: 0.75rem; }
      .project-list li {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0.5rem 0.6rem; border-radius: 6px; cursor: pointer;
        font-size: 0.9rem; transition: background 0.12s; gap: 0.3rem;
      }
      .project-list li:hover { background: #ebf4ff; }
      .project-list li.selected { background: #bee3f8; font-weight: 600; color: #2b6cb0; }
      .project-list li.empty { cursor: default; color: #a0aec0; font-size: 0.85rem; justify-content: center; padding: 1rem; }
      .project-list li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
      .project-actions { display: flex; gap: 0.2rem; flex-shrink: 0; opacity: 0; transition: opacity 0.12s; }
      .project-list li:hover .project-actions,
      .project-list li.selected .project-actions { opacity: 1; }
      .project-rename-form { display: flex; gap: 0.3rem; flex: 1; min-width: 0; }
      .project-rename-form input {
        flex: 1; min-width: 0; border: 1px solid #4299e1;
        border-radius: 4px; padding: 0.2rem 0.4rem; font-size: 0.85rem; outline: none;
      }
      .project-rename-form button {
        border-radius: 4px; font-size: 0.75rem; padding: 0.2rem 0.4rem;
        cursor: pointer; border: 1px solid; white-space: nowrap;
      }
      .btn-rename-ok   { background: #4299e1; color: white; border-color: #4299e1; }
      .btn-rename-ok:hover { background: #3182ce; }
      .btn-rename-cancel { background: white; color: #718096; border-color: #e2e8f0; }
      .btn-rename-cancel:hover { background: #f7fafc; }

      /* ---- CONTENT ---- */
      .content {
        flex: 1; background: white;
        border-radius: 10px; padding: 1.25rem 1.5rem;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }
      .content-placeholder {
        text-align: center; padding: 3rem 1rem; color: #a0aec0;
      }
      .content-placeholder .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
      .content-placeholder p { font-size: 0.9rem; }

      .project-title { font-size: 1.3rem; font-weight: 700; color: #1a202c; }
      .project-meta { font-size: 0.78rem; color: #a0aec0; margin-top: 0.2rem; }

      /* ---- SECTION ---- */
      .section { margin-top: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 1.25rem; }
      .section-header {
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem;
      }
      .section-title { font-size: 0.95rem; font-weight: 600; color: #2d3748; }

      /* ---- BUTTONS ---- */
      button, .btn { cursor: pointer; border-radius: 6px; font-size: 0.85rem; font-family: inherit; transition: all 0.12s; }
      .btn-primary {
        background: #4299e1; border: none; color: white;
        padding: 0.45rem 0.9rem; font-weight: 500;
      }
      .btn-primary:hover { background: #3182ce; }
      .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
      .btn-secondary {
        background: white; border: 1px solid #e2e8f0; color: #4a5568;
        padding: 0.45rem 0.9rem;
      }
      .btn-secondary:hover { background: #f7fafc; border-color: #cbd5e0; }
      .btn-ghost {
        background: transparent; border: none; color: #718096;
        padding: 0.3rem 0.5rem; font-size: 0.8rem;
      }
      .btn-ghost:hover { color: #e53e3e; }
      .btn-danger-soft {
        background: transparent; border: none; color: #fc8181;
        padding: 0.25rem 0.5rem; font-size: 0.85rem; font-weight: 600;
      }
      .btn-danger-soft:hover { color: #e53e3e; }
      .btn-group { display: flex; gap: 0.4rem; align-items: center; }

      /* ---- ENTITY FORM ---- */
      .entity-form {
        background: #f7fafc; border: 1px solid #e2e8f0;
        border-radius: 8px; padding: 1rem; margin: 0.75rem 0;
      }
      .form-row { display: flex; gap: 1rem; margin-bottom: 0.75rem; }
      .form-field { display: flex; flex-direction: column; gap: 0.3rem; }
      .form-field label { font-size: 0.78rem; font-weight: 500; color: #4a5568; }
      .form-field input, .form-field select {
        border: 1px solid #e2e8f0; border-radius: 6px;
        padding: 0.4rem 0.6rem; font-size: 0.88rem;
      }
      .form-field input:focus, .form-field select:focus { outline: none; border-color: #4299e1; }
      .form-field input[type="number"] { width: 90px; }

      .attrs-header {
        font-size: 0.78rem; font-weight: 600; color: #4a5568;
        text-transform: uppercase; letter-spacing: 0.05em;
        margin: 0.5rem 0 0.4rem;
      }
      .attribute-row {
        display: flex; gap: 0.4rem; align-items: center;
        background: white; border: 1px solid #e2e8f0;
        border-radius: 6px; padding: 0.4rem 0.6rem; margin-bottom: 0.35rem;
      }
      .attribute-row input[type="text"] {
        border: none; outline: none; font-size: 0.85rem;
        width: 130px; flex-shrink: 0;
      }
      .attr-sep { color: #cbd5e0; font-size: 0.75rem; }
      .attribute-row select {
        border: none; outline: none; font-size: 0.82rem;
        color: #4a5568; background: transparent; cursor: pointer;
      }
      .attr-extra { display: flex; gap: 0.3rem; align-items: center; flex: 1; }
      .attr-extra input {
        border: 1px solid #e2e8f0; border-radius: 4px;
        padding: 0.2rem 0.4rem; font-size: 0.8rem; width: 70px;
      }
      .attr-extra input[placeholder="valeurs"] { width: 160px; }
      .attr-extra span { font-size: 0.75rem; color: #a0aec0; }

      /* ---- ENTITY TABLE ---- */
      .entity-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 0.5rem; }
      .entity-table th {
        background: #f7fafc; border-bottom: 2px solid #e2e8f0;
        padding: 0.5rem 0.75rem; text-align: left;
        font-size: 0.75rem; font-weight: 600; color: #718096;
        text-transform: uppercase; letter-spacing: 0.05em;
      }
      .entity-table td { padding: 0.55rem 0.75rem; border-bottom: 1px solid #f0f2f5; }
      .entity-table tr:last-child td { border-bottom: none; }
      .entity-table tr:hover td { background: #f7fafc; }
      .entity-name { font-weight: 600; color: #2d3748; }
      .qty-badge {
        display: inline-block; background: #ebf4ff; color: #2b6cb0;
        border-radius: 12px; padding: 0.1rem 0.5rem; font-size: 0.78rem; font-weight: 600;
      }
      .attr-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
      .attr-tag {
        background: #edf2f7; color: #4a5568;
        border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.75rem;
      }
      .empty-row td { text-align: center; color: #a0aec0; padding: 2rem; }

      /* ---- EXPORT BUTTONS ---- */
      .export-group { display: flex; gap: 0.5rem; margin: 0.5rem 0 1rem; align-items: center; }
      .export-label { font-size: 0.78rem; color: #a0aec0; font-weight: 500; }
      .export-btn {
        display: inline-flex; align-items: center; gap: 0.3rem;
        padding: 0.4rem 0.9rem; border-radius: 6px; font-size: 0.82rem;
        font-weight: 600; text-decoration: none; border: 1px solid;
        transition: all 0.12s; cursor: pointer;
      }
      .export-json { color: #276749; background: #f0fff4; border-color: #9ae6b4; }
      .export-json:hover { background: #c6f6d5; }
      .export-xml  { color: #744210; background: #fffff0; border-color: #f6e05e; }
      .export-xml:hover  { background: #fefcbf; }
      .btn-edit {
        background: transparent; border: none; color: #4299e1;
        padding: 0.25rem 0.5rem; font-size: 0.9rem; cursor: pointer;
      }
      .btn-edit:hover { color: #2b6cb0; }

      /* ---- BANNERS ---- */
      .banner {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.65rem 1rem; border-radius: 8px;
        font-size: 0.88rem; margin: 0.75rem 0;
      }
      .banner-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      .banner-error   { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
      .banner-error .banner-dot { background: #e53e3e; }
      .banner-warning { background: #fffbeb; color: #92400e; border: 1px solid #fcd34d; }
      .banner-warning .banner-dot { background: #f59e0b; }
      .banner-success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
      .banner-success .banner-dot { background: #38a169; }
      .banner-text { flex: 1; }
      .banner-close { background: none; border: none; cursor: pointer; color: inherit; opacity: 0.6; font-size: 1rem; padding: 0; }

      /* ---- PREVIEW ---- */
      .preview-block { margin-top: 1rem; }
      .preview-entity-title {
        font-size: 0.85rem; font-weight: 600; color: #2d3748;
        margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.5rem;
      }
      .record-count { font-weight: 400; color: #a0aec0; font-size: 0.8rem; }
      .preview-table-wrap { overflow-x: auto; border-radius: 6px; border: 1px solid #e2e8f0; }
      .preview-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; white-space: nowrap; }
      .preview-table th {
        background: #f7fafc; padding: 0.4rem 0.75rem;
        text-align: left; border-bottom: 1px solid #e2e8f0;
        font-size: 0.72rem; font-weight: 600; color: #718096;
        text-transform: uppercase;
      }
      .preview-table td { padding: 0.35rem 0.75rem; border-bottom: 1px solid #f0f2f5; }
      .preview-table tr:nth-child(even) td { background: #f7fafc; }
      .preview-table tr:last-child td { border-bottom: none; }
      .preview-note { font-size: 0.75rem; color: #a0aec0; margin-top: 0.3rem; }

      input, select { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const MANAGER_URL   = 'http://localhost:8081/api';
      const GENERATOR_URL = 'http://localhost:8082/api/generator';

      async function toError(res) {
        try { const b = await res.json(); return new Error(b.message || `Erreur ${res.status}`); }
        catch { return new Error(`Erreur ${res.status}`); }
      }
      async function listProjects()              { const r = await fetch(`${MANAGER_URL}/projects`); if (!r.ok) throw await toError(r); return r.json(); }
      async function createProject(name)         { const r = await fetch(`${MANAGER_URL}/projects`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name}) }); if (!r.ok) throw await toError(r); return r.json(); }
      async function deleteProject(id)           { const r = await fetch(`${MANAGER_URL}/projects/${id}`, {method:'DELETE'}); if (!r.ok) throw await toError(r); }
      async function updateProject(id, name)     { const r = await fetch(`${MANAGER_URL}/projects/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name}) }); if (!r.ok) throw await toError(r); return r.json(); }
      async function listEntities(pid)           { const r = await fetch(`${MANAGER_URL}/projects/${pid}/entities`); if (!r.ok) throw await toError(r); return r.json(); }
      async function createEntity(pid, entity)   { const r = await fetch(`${MANAGER_URL}/projects/${pid}/entities`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(entity) }); if (!r.ok) throw await toError(r); return r.json(); }
      async function deleteEntity(id)            { const r = await fetch(`${MANAGER_URL}/entities/${id}`, {method:'DELETE'}); if (!r.ok) throw await toError(r); }
      async function updateEntity(id, entity)   { const r = await fetch(`${MANAGER_URL}/entities/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(entity) }); if (!r.ok) throw await toError(r); return r.json(); }
      async function previewData(pid)            { const r = await fetch(`${GENERATOR_URL}/${pid}/preview`); if (!r.ok) throw await toError(r); return r.json(); }
      const exportUrl = (pid, fmt) => `${GENERATOR_URL}/${pid}/export?format=${fmt}`;

      const TYPE_OPTIONS = [
        { value:'StringType',  label:'Texte'        },
        { value:'IntegerType', label:'Entier'        },
        { value:'FloatType',   label:'Decimal'       },
        { value:'BooleanType', label:'Booleen'       },
        { value:'DateType',    label:'Date'          },
        { value:'EnumType',    label:'Enumeration'   },
      ];

      const emptyAttr   = () => ({ name:'', typeClass:'StringType', min:'', max:'', enumValues:'' });
      const emptyEntity = () => ({ name:'', quantity:10, attributes:[emptyAttr()] });
      const demoEntity  = () => ({
        name: 'Utilisateur', quantity: 5,
        attributes: [
          { name:'fullName', typeClass:'StringType',  min:'', max:'', enumValues:'' },
          { name:'email',    typeClass:'StringType',  min:'', max:'', enumValues:'' },
          { name:'age',      typeClass:'IntegerType', min:'18', max:'65', enumValues:'' },
        ],
      });

      function buildAttrPayload(a) {
        const type = a.typeClass === 'EnumType'
          ? { typeClass:'EnumType', values: a.enumValues.split(',').map(v=>v.trim()).filter(Boolean) }
          : { typeClass: a.typeClass };
        const constraints = [];
        if ((a.typeClass==='IntegerType'||a.typeClass==='FloatType') && (a.min!==''||a.max!=='')) {
          const n = a.typeClass==='FloatType' ? parseFloat : v=>parseInt(v,10);
          constraints.push({ constraintClass:'MinMaxConstraint', min:n(a.min||0), max:n(a.max||0) });
        }
        return { name:a.name, type, constraints };
      }

      function buildEntityPayload(e) {
        return {
          name: e.name,
          quantity: Number(e.quantity)||1,
          attributes: e.attributes.filter(a=>a.name.trim()).map(buildAttrPayload),
          subEntities: [],
        };
      }

      // Convertit une entité de l'API vers le format du formulaire
      function entityToFormState(ent) {
        return {
          name: ent.name,
          quantity: ent.quantity,
          attributes: (ent.attributes || []).map(a => {
            const typeClass = a.type?.typeClass || 'StringType';
            const mmConstraint = (a.constraints || []).find(c => c.constraintClass === 'MinMaxConstraint');
            return {
              name: a.name,
              typeClass,
              min: mmConstraint ? String(mmConstraint.min) : '',
              max: mmConstraint ? String(mmConstraint.max) : '',
              enumValues: typeClass === 'EnumType' && a.type?.values ? a.type.values.join(', ') : '',
            };
          }),
        };
      }

      // ── App ────────────────────────────────────────────────────────────
      function App() {
        const [projects,         setProjects]         = useState([]);
        const [selectedId,       setSelectedId]       = useState(null);
        const [entities,         setEntities]         = useState([]);
        const [newProjectName,   setNewProjectName]   = useState('');
        const [newEntity,        setNewEntity]        = useState(emptyEntity());
        const [showForm,         setShowForm]         = useState(false);
        const [editingEntityId,  setEditingEntityId]  = useState(null);
        const [renamingId,       setRenamingId]       = useState(null);
        const [renameValue,      setRenameValue]      = useState('');
        const [preview,          setPreview]          = useState(null);
        const [previewLoading,   setPreviewLoading]   = useState(false);
        const [error,            setError]            = useState(null);

        useEffect(() => { loadProjects(); }, []);

        useEffect(() => {
          if (selectedId) { loadEntities(selectedId); setPreview(null); setShowForm(false); setEditingEntityId(null); setNewEntity(emptyEntity()); }
          else setEntities([]);
        }, [selectedId]);

        async function loadProjects() {
          try { setError(null); setProjects(await listProjects()); }
          catch(e) { setError(`Impossible de charger les projets — dataset-manager est-il demarré ? (${e.message})`); }
        }

        async function loadEntities(id) {
          try { setError(null); setEntities(await listEntities(id)); }
          catch(e) { setError(e.message); }
        }

        async function handleCreateProject(e) {
          e.preventDefault();
          if (!newProjectName.trim()) return;
          try {
            setError(null);
            const p = await createProject(newProjectName.trim());
            setNewProjectName('');
            await loadProjects();
            setSelectedId(p.id);
          } catch(e) { setError(e.message); }
        }

        async function handleDeleteProject(id) {
          try { setError(null); await deleteProject(id); if (selectedId===id) setSelectedId(null); await loadProjects(); }
          catch(e) { setError(e.message); }
        }

        function startRename(p, e) {
          e.stopPropagation();
          setRenamingId(p.id);
          setRenameValue(p.name);
        }

        async function handleRename(e) {
          e.preventDefault();
          if (!renameValue.trim()) return;
          try {
            setError(null);
            await updateProject(renamingId, renameValue.trim());
            setRenamingId(null);
            await loadProjects();
          } catch(e) { setError(e.message); }
        }

        function updateAttr(idx, field, val) {
          setNewEntity(prev => {
            const attrs = [...prev.attributes];
            attrs[idx] = {...attrs[idx], [field]:val};
            return {...prev, attributes:attrs};
          });
        }

        async function handleCreateEntity(e) {
          e.preventDefault();
          if (!selectedId || !newEntity.name.trim()) return;
          try {
            setError(null);
            if (editingEntityId) {
              await updateEntity(editingEntityId, buildEntityPayload(newEntity));
            } else {
              await createEntity(selectedId, buildEntityPayload(newEntity));
            }
            setNewEntity(emptyEntity()); setShowForm(false); setEditingEntityId(null);
            await loadEntities(selectedId);
          } catch(e) { setError(e.message); }
        }

        function handleEditEntity(ent) {
          setNewEntity(entityToFormState(ent));
          setEditingEntityId(ent.id);
          setShowForm(true);
        }

        function handleCancelForm() {
          setShowForm(false);
          setEditingEntityId(null);
          setNewEntity(emptyEntity());
        }

        async function handleDeleteEntity(id) {
          try { setError(null); await deleteEntity(id); await loadEntities(selectedId); }
          catch(e) { setError(e.message); }
        }

        async function handlePreview() {
          if (!selectedId) return;
          try { setError(null); setPreviewLoading(true); setPreview(await previewData(selectedId)); }
          catch(e) { setError(`Apercu impossible — generator-service est-il demarré ? (${e.message})`); }
          finally { setPreviewLoading(false); }
        }

        const selectedProject = projects.find(p => p.id === selectedId);

        return (
          <div>
            <header className="app-header">
              <div className="header-logo">D</div>
              <div className="header-info">
                <h1>Generateur de Datasets</h1>
                <p>
                  <code>dataset-manager</code> :8081 &nbsp;|&nbsp;
                  <code>generator</code> :8082 &nbsp;|&nbsp;
                  <code>gateway</code> :8083 &nbsp;|&nbsp;
                  Eureka : <a href="http://localhost:8761" target="_blank" style={{color:'#63b3ed'}}>localhost:8761</a>
                </p>
              </div>
            </header>

            <div className="layout">
              {/* ── SIDEBAR ── */}
              <aside className="sidebar">
                <h2>Projets ({projects.length})</h2>

                <form onSubmit={handleCreateProject} className="inline-form">
                  <input
                    type="text" placeholder="Nom du projet"
                    value={newProjectName}
                    onChange={e => setNewProjectName(e.target.value)}
                  />
                  <button type="submit" className="btn-primary">+</button>
                </form>

                <ul className="project-list">
                  {projects.map(p => (
                    <li key={p.id} className={p.id===selectedId?'selected':''} onClick={()=>{if(renamingId!==p.id)setSelectedId(p.id);}}>
                      {renamingId === p.id ? (
                        <form onSubmit={handleRename} className="project-rename-form" onClick={e=>e.stopPropagation()}>
                          <input type="text" autoFocus value={renameValue} onChange={e=>setRenameValue(e.target.value)} />
                          <button type="submit" className="btn-rename-ok">OK</button>
                          <button type="button" className="btn-rename-cancel" onClick={e=>{e.stopPropagation();setRenamingId(null);}}>×</button>
                        </form>
                      ) : (
                        <React.Fragment>
                          <span title={p.name}>{p.name}</span>
                          <div className="project-actions" onClick={e=>e.stopPropagation()}>
                            <button className="btn-edit" title="Renommer" onClick={e=>startRename(p,e)}>R</button>
                            <button className="btn-danger-soft" title="Supprimer" onClick={e=>{e.stopPropagation();handleDeleteProject(p.id);}}>×</button>
                          </div>
                        </React.Fragment>
                      )}
                    </li>
                  ))}
                  {projects.length===0 && <li className="empty">Aucun projet</li>}
                </ul>

                <button className="btn-secondary" style={{width:'100%',fontSize:'0.8rem'}} onClick={loadProjects}>
                  Rafraichir la liste
                </button>
              </aside>

              {/* ── MAIN ── */}
              <main className="content">
                {error && (
                  <div className="banner banner-error">
                    <div className="banner-dot"></div>
                    <span className="banner-text">{error}</span>
                    <button className="banner-close" onClick={()=>setError(null)}>×</button>
                  </div>
                )}

                {!selectedProject && (
                  <div className="content-placeholder">
                    <div className="icon"></div>
                    <p>Selectionnez ou creez un projet dans la sidebar pour commencer.</p>
                  </div>
                )}

                {selectedProject && (
                  <React.Fragment>
                    <div className="project-title">{selectedProject.name}</div>
                    <div className="project-meta">
                      Cree le {selectedProject.dateCreated} · Modifie le {selectedProject.lastUpdated}
                    </div>

                    {/* ── Entites ── */}
                    <section className="section">
                      <div className="section-header">
                        <span className="section-title">Entites ({entities.length})</span>
                        <div className="btn-group">
                          {!showForm && (
                            <button className="btn-secondary" onClick={()=>{setNewEntity(demoEntity());setEditingEntityId(null);setShowForm(true);}}>
                              Demo rapide
                            </button>
                          )}
                          <button className="btn-primary" onClick={showForm ? handleCancelForm : ()=>{setNewEntity(emptyEntity());setEditingEntityId(null);setShowForm(true);}}>
                            {showForm ? 'Fermer' : '+ Ajouter'}
                          </button>
                        </div>
                      </div>

                      {showForm && (
                        <form onSubmit={handleCreateEntity} className="entity-form">
                          <div style={{fontSize:'0.8rem',fontWeight:600,color:'#4a5568',marginBottom:'0.5rem'}}>
                            {editingEntityId ? 'Modifier l\'entite' : 'Nouvelle entite'}
                          </div>
                          <div className="form-row">
                            <div className="form-field" style={{flex:1}}>
                              <label>Nom de l'entite</label>
                              <input type="text" required
                                value={newEntity.name}
                                onChange={e=>setNewEntity(p=>({...p,name:e.target.value}))}
                                placeholder="ex: Client, Produit..."
                              />
                            </div>
                            <div className="form-field">
                              <label>Quantite</label>
                              <input type="number" min="1"
                                value={newEntity.quantity}
                                onChange={e=>setNewEntity(p=>({...p,quantity:e.target.value}))}
                              />
                            </div>
                          </div>

                          <div className="attrs-header">Attributs</div>
                          {newEntity.attributes.map((attr, idx) => (
                            <div className="attribute-row" key={idx}>
                              <input type="text" placeholder="nom attribut"
                                value={attr.name}
                                onChange={e=>updateAttr(idx,'name',e.target.value)}
                              />
                              <span className="attr-sep">|</span>
                              <select value={attr.typeClass} onChange={e=>updateAttr(idx,'typeClass',e.target.value)}>
                                {TYPE_OPTIONS.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}
                              </select>
                              <div className="attr-extra">
                                {(attr.typeClass==='IntegerType'||attr.typeClass==='FloatType') && (
                                  <React.Fragment>
                                    <span>min</span>
                                    <input type="number" placeholder="0" value={attr.min} onChange={e=>updateAttr(idx,'min',e.target.value)} />
                                    <span>max</span>
                                    <input type="number" placeholder="100" value={attr.max} onChange={e=>updateAttr(idx,'max',e.target.value)} />
                                  </React.Fragment>
                                )}
                                {attr.typeClass==='EnumType' && (
                                  <input type="text" placeholder="valeurs" style={{width:'180px'}}
                                    value={attr.enumValues}
                                    onChange={e=>updateAttr(idx,'enumValues',e.target.value)}
                                  />
                                )}
                              </div>
                              <button type="button" className="btn-danger-soft"
                                disabled={newEntity.attributes.length===1}
                                onClick={()=>setNewEntity(p=>({...p,attributes:p.attributes.filter((_,i)=>i!==idx)}))}>
                                ×
                              </button>
                            </div>
                          ))}

                          <div className="btn-group" style={{marginTop:'0.25rem'}}>
                            <button type="button" className="btn-secondary"
                              onClick={()=>setNewEntity(p=>({...p,attributes:[...p.attributes,emptyAttr()]}))}>
                              + Attribut
                            </button>
                            <button type="submit" className="btn-primary">
                              {editingEntityId ? 'Mettre a jour' : 'Enregistrer'}
                            </button>
                            <button type="button" className="btn-secondary" onClick={handleCancelForm}>Annuler</button>
                          </div>
                        </form>
                      )}

                      <table className="entity-table">
                        <thead>
                          <tr>
                            <th>Entite</th>
                            <th>Quantite</th>
                            <th>Attributs</th>
                            <th></th>
                          </tr>
                        </thead>
                        <tbody>
                          {entities.map(ent => (
                            <tr key={ent.id}>
                              <td className="entity-name">{ent.name}</td>
                              <td><span className="qty-badge">{ent.quantity} lignes</span></td>
                              <td>
                                <div className="attr-tags">
                                  {(ent.attributes||[]).map(a=>(
                                    <span className="attr-tag" key={a.name}>{a.name}</span>
                                  ))}
                                </div>
                              </td>
                              <td>
                                <div className="btn-group">
                                  <button className="btn-edit" title="Modifier" onClick={()=>handleEditEntity(ent)}>Modifier</button>
                                  <button className="btn-danger-soft" title="Supprimer" onClick={()=>handleDeleteEntity(ent.id)}>×</button>
                                </div>
                              </td>
                            </tr>
                          ))}
                          {entities.length===0 && (
                            <tr className="empty-row"><td colSpan="4">Aucune entite — cliquez sur "+ Ajouter" pour commencer</td></tr>
                          )}
                        </tbody>
                      </table>
                    </section>

                    {/* ── Generation ── */}
                    <section className="section">
                      <div className="section-header">
                        <span className="section-title">Generation de donnees</span>
                        <button className="btn-primary" onClick={handlePreview} disabled={previewLoading}>
                          {previewLoading ? 'Generation...' : 'Apercu (preview)'}
                        </button>
                      </div>

                      <div className="export-group">
                        <span className="export-label">Exporter :</span>
                        <a className="export-btn export-json" href={exportUrl(selectedId,'json')} target="_blank" rel="noreferrer">
                          JSON
                        </a>
                        <a className="export-btn export-xml" href={exportUrl(selectedId,'xml')} target="_blank" rel="noreferrer">
                          XML
                        </a>
                      </div>

                      {preview && (
                        <div className={`banner ${preview.status==='PARTIAL'?'banner-warning':'banner-success'}`}>
                          <div className="banner-dot"></div>
                          <span className="banner-text">
                            <strong>Statut : {preview.status}</strong>
                            {preview.message ? ` — ${preview.message}` : ' — Generation reussie'}
                          </span>
                          <button className="banner-close" onClick={()=>setPreview(null)}>×</button>
                        </div>
                      )}

                      {preview && preview.data && preview.data.map(ed => (
                        <div className="preview-block" key={ed.entityName}>
                          <div className="preview-entity-title">
                            {ed.entityName}
                            <span className="record-count">{ed.records.length} enregistrements</span>
                          </div>
                          {ed.records.length > 0 && (
                            <React.Fragment>
                              <div className="preview-table-wrap">
                                <table className="preview-table">
                                  <thead>
                                    <tr>{Object.keys(ed.records[0].fields).map(k=><th key={k}>{k}</th>)}</tr>
                                  </thead>
                                  <tbody>
                                    {ed.records.slice(0,10).map((rec,i)=>(
                                      <tr key={i}>{Object.values(rec.fields).map((v,j)=><td key={j}>{String(v)}</td>)}</tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                              {ed.records.length > 10 && (
                                <p className="preview-note">Affichage des 10 premiers enregistrements sur {ed.records.length}.</p>
                              )}
                            </React.Fragment>
                          )}
                        </div>
                      ))}
                    </section>
                  </React.Fragment>
                )}
              </main>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
