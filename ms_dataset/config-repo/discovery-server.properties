
spring.application.name=discovery-server
# Prevent Eureka Server to register itself as a Client
eureka.client.fetch-registry=false
# Prevent Eureka Server to register itself in the service registry
eureka.client.register-with-eureka=false
# Note: we would enable both if we had many Eureka Servers
server.port=8761




# The server refreshes the registry it serves every 30 s by default: a service that just registered stayed
# invisible to the others for up to half a minute. 3 s suits a local setup.
eureka.server.response-cache-update-interval-ms=3000
