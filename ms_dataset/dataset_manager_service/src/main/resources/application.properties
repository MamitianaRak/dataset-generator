spring.application.name=dataset-manager
# The config server is required: a service started before it used to come up on Spring's default port 8080
# without its settings (port clash, no /api prefix, no database file). It now stops with a clear error.
# Start the config server first, then discovery, then the services. Docker Compose
# overrides the import with SPRING_CONFIG_IMPORT and orders start-up with health checks.
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.fail-fast=true

# Persistence settings the code relies on stay with the code; the config server holds the environment
# (database address, credentials).
# The schema belongs to Flyway (db/migration); Hibernate only checks that the mapping matches it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading from controllers: every query is issued, and counted, inside the service.
spring.jpa.open-in-view=false
# Inserts and updates sent in JDBC batches (possible because ids come from sequences, not IDENTITY).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Jackson 3 (Spring Boot 4) rejects a missing number for an int field ("Cannot map null into type int"), where
# Jackson 2 used 0: a body without an attribute's optional "quantity" was refused as unreadable JSON. Back to 0;
# required numbers are enforced by Bean Validation (@Min on an entity's quantity), with a clear message.
spring.jackson.deserialization.fail-on-null-for-primitives=false
