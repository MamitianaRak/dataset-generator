
spring.application.name=dataset-manager
server.port=8081
server.servlet.context-path=/api

# PostgreSQL; docker-compose sets these variables, the defaults fit a local database.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dataset_manager}
spring.datasource.username=${DATABASE_USER:dataset}
spring.datasource.password=${DATABASE_PASSWORD:dataset}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# spring.config.import can be set locally on the service if needed
# spring.config.import=optional:configserver:http://localhost:8888
