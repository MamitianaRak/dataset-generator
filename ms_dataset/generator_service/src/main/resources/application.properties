spring.application.name=generator
# The config server is required: a service started before it used to come up on Spring's default port 8080
# without its settings (port clash, no /api prefix, no database file). It now stops with a clear error.
# Start the config server first, then discovery, then the services. Docker Compose
# overrides the import with SPRING_CONFIG_IMPORT and orders start-up with health checks.
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.fail-fast=true

# Jackson 3 rejects a missing number for an int field; dataset-manager's DTOs have optional ones (an attribute's
# quantity). Missing numbers read as 0, as with Jackson 2, so a response is never refused for that.
spring.jackson.deserialization.fail-on-null-for-primitives=false
